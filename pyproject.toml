[project]
name = "pokemon-mosaic"
version = "0.1.0"
description = "Génère une mosaïque de cartes Pokémon en optimisant la continuité des couleurs entre cartes voisines."
requires-python = ">=3.13"

# Versions reprises à l'identique de l'environnement d'origine
# (récupérées depuis les noms de dossiers .dist-info du venv perdu).
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "scipy==1.16.3",
    "pillow==12.0.0",
    # Utilisé uniquement par experiments/tsne_assignment.py
    "scikit-learn==1.7.2",
]

# matplotlib était installé dans l'ancien venv mais n'est importé nulle part.
# Volontairement non réinstallé.

[project.scripts]
pokemon-mosaic = "pokemon_mosaic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_mosaic"]
