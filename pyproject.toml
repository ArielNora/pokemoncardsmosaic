[project]
name = "pokemon-mosaic"
version = "0.1.0"
description = "Génère une mosaïque de cartes Pokémon en optimisant la continuité des couleurs entre cartes voisines."
requires-python = ">=3.13"

# Socle volontairement minimal : ~37 Mo au lieu de 245 Mo.
# opencv est remplacé par Pillow, scipy par des matrices de distances numpy
# (vérifiées bit à bit identiques). Voir SPEC.md §8.
dependencies = [
    "numpy==2.2.6",
    "pillow==12.0.0",
    "PySide6==6.10.0",
]

[project.optional-dependencies]
# Requis uniquement pour relancer experiments/, qui n'est plus maintenu.
#   uv sync --extra experiments
experiments = [
    "opencv-python==4.12.0.88",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

# matplotlib était installé dans l'ancien venv mais n'est importé nulle part.
# Volontairement non réinstallé.

[project.scripts]
pokemon-mosaic = "pokemon_mosaic.cli:main"
pokemon-mosaic-ui = "pokemon_mosaic.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_mosaic"]

[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
# F : imports et variables inutilisés — c'est le gain principal.
# I : tri des imports.
# B : pièges courants (bugbear).
# La modernisation du typage (UP) est volontairement écartée : elle réécrirait
# toutes les annotations du projet sans rapport avec la qualité du code.
extend-select = ["I", "B"]
ignore = [
    # Les tableaux de mesures dans les docstrings dépassent volontairement.
    "E501",
    # Signature imposée par Qt : `parent=QModelIndex()` est la convention des
    # modèles, on ne peut pas y déroger.
    "B008",
]
