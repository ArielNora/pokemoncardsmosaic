[project]
name = "pokemon-mosaic"
version = "0.1.0"
description = "Génère une mosaïque de cartes Pokémon en optimisant la continuité des couleurs entre cartes voisines."
requires-python = ">=3.13"

# Socle volontairement minimal : ~37 Mo au lieu de 245 Mo.
# opencv est remplacé par Pillow, scipy par des matrices de distances numpy
# (vérifiées bit à bit identiques). Voir SPEC.md §8.
dependencies = [
    "numpy==2.2.6",
    "pillow==12.0.0",
    "PySide6==6.10.0",
]

[project.optional-dependencies]
# Requis uniquement pour relancer experiments/, qui n'est plus maintenu.
#   uv sync --extra experiments
experiments = [
    "opencv-python==4.12.0.88",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
]
dev = [
    "pytest>=8",
]

# matplotlib était installé dans l'ancien venv mais n'est importé nulle part.
# Volontairement non réinstallé.

[project.scripts]
pokemon-mosaic = "pokemon_mosaic.cli:main"
pokemon-mosaic-ui = "pokemon_mosaic.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_mosaic"]
